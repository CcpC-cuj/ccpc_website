name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: Firebase-CcpC
    env:
      REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL }}
      REACT_APP_CORS_ORIGIN: ${{ secrets.REACT_APP_CORS_ORIGIN }}
      REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
      REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
      REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
      REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
      REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
      REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
      REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}
      REACT_APP_THREADS_FIREBASE_API_KEY: ${{ secrets.REACT_APP_THREADS_FIREBASE_API_KEY }}
      REACT_APP_THREADS_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_THREADS_FIREBASE_AUTH_DOMAIN }}
      REACT_APP_THREADS_FIREBASE_DATABASE_URL: ${{ secrets.REACT_APP_THREADS_FIREBASE_DATABASE_URL }}
      REACT_APP_THREADS_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_THREADS_FIREBASE_PROJECT_ID }}
      REACT_APP_THREADS_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_THREADS_FIREBASE_STORAGE_BUCKET }}
      REACT_APP_THREADS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_THREADS_FIREBASE_MESSAGING_SENDER_ID }}
      REACT_APP_THREADS_FIREBASE_APP_ID: ${{ secrets.REACT_APP_THREADS_FIREBASE_APP_ID }}
      REACT_APP_THREADS_FIREBASE_MEASUREMENT_ID: ${{ secrets.REACT_APP_THREADS_FIREBASE_MEASUREMENT_ID }}
      REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
      REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
      REACT_APP_ADSENSE_CLIENT_ID: ${{ secrets.REACT_APP_ADSENSE_CLIENT_ID }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Disable CI strict mode
        run: echo "CI=false" >> $GITHUB_ENV

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: npx firebase deploy --token $FIREBASE_TOKEN --only hosting